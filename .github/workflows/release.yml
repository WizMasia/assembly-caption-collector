name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Unit Tests
        run: |
          node tests/constants.test.js
          node tests/export-formatter.test.js
          node tests/caption-engine.test.js
          node tests/popup.test.js

      - name: Package Chrome Extension
        id: package
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          ZIP_NAME="assembly-caption-collector-${VERSION}.zip"
          zip -r "${ZIP_NAME}" \
            manifest.json \
            config \
            content \
            popup \
            utils \
            icons \
            README.md \
            LICENSE \
            -x "*.DS_Store" -x "*__MACOSX*"
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: 대한민국 국회 의사중계 자막 수집기 ${{ github.ref_name }}
          files: ${{ steps.package.outputs.zip_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
